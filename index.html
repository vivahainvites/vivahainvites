    <div class="fld"><label for="b-t">Title</label><input class="inp" id="b-t" required value="${esc(b.title)}"></div>
    <div class="row3"><div class="fld"><label for="b-s">URL slug</label><input class="inp" id="b-s" value="${esc(b.slug)}"></div><div class="fld"><label for="b-c">Category</label><input class="inp" id="b-c" value="${esc(b.category)}" list="bcats"><datalist id="bcats"><option>Planning</option><option>Traditions</option><option>Inspiration</option><option>Guides</option></datalist></div><div class="fld"><label for="b-d">Date</label><input class="inp" id="b-d" type="date" value="${esc(b.date)}"></div></div>
    <div class="fld"><span class="lbl">Cover image</span><div class="upl"><div class="pv" id="bpv" style="width:140px;height:88px">${blogCover(b)}</div><input type="file" id="b-img" accept="image/*"><button type="button" class="btn btn-ghost btn-sm" id="b-rm" ${b.cover ? '' : 'hidden'}>Remove image</button></div><span class="help">Without an image, a patterned cover is generated.</span></div>
    <div class="fld"><label for="b-e">Description</label><textarea class="inp" id="b-e" style="min-height:70px">${esc(b.excerpt)}</textarea></div>
    <div class="fld"><label for="b-body">Content</label><textarea class="inp tall" id="b-body">${esc(b.content)}</textarea><span class="help">Blank line between paragraphs. Start a line with ## for a heading, or - for a list item.</span></div>
    <div class="checkrow"><label>${sw('id="b-pub"', b.published)} Published</label></div>
    <div class="fsec"><h3>SEO</h3><div class="row2"><div class="fld"><label for="b-st">SEO title</label><input class="inp" id="b-st" value="${esc(b.seoTitle)}"></div><div class="fld"><label for="b-sd">SEO description</label><input class="inp" id="b-sd" value="${esc(b.seoDescription)}"></div></div></div>
    <div class="form-foot"><a class="btn btn-ghost btn-sm" href="#/admin/blogs">Cancel</a><button class="btn btn-primary btn-sm" type="submit">${editing ? 'Save changes' : 'Create blog'}</button></div>
  </div></form>`;
  return {html:adminLayout('blogs', editing ? 'Edit blog' : 'New blog', body), after:() => {
    adminBind(); let touched = editing;
    $('#b-t').oninput = e => { if(!touched) $('#b-s').value = slugify(e.target.value); };
    $('#b-s').oninput = () => touched = true;
    $('#b-img').onchange = async e => { const f = e.target.files[0]; if(!f) return; try { b.cover = await readImage(f, 1400); $('#bpv').innerHTML = blogCover(b); $('#b-rm').hidden = false; } catch(err){ toast('That file could not be read. Try a JPG or PNG.'); } };
    $('#b-rm').onclick = () => { b.cover = ''; $('#b-img').value = ''; $('#bpv').innerHTML = blogCover(b); $('#b-rm').hidden = true; };
    $('#bf').onsubmit = async e => { e.preventDefault(); const title = $('#b-t').value.trim(); if(!title){ toast('Add a title.'); return; }
      const slug = slugify($('#b-s').value || title); if(DB.blogs.some(x => x.slug === slug && x.id !== b.id)){ toast('Another post already uses that slug.'); return; }
      Object.assign(b, {title, slug, category:$('#b-c').value.trim() || 'Planning', date:$('#b-d').value, excerpt:$('#b-e').value.trim(), content:$('#b-body').value, published:$('#b-pub').checked, seoTitle:$('#b-st').value.trim(), seoDescription:$('#b-sd').value.trim()});
      if(editing){ const i = DB.blogs.findIndex(x => x.id === b.id); DB.blogs[i] = b; } else DB.blogs.push(b);
      if(await save()){ toast(editing ? 'Changes saved.' : 'Blog created.'); location.hash = '#/admin/blogs'; } };
  }};
}

/* ---------- admin: FAQs and features (ordered lists) ---------- */
function orderedManager(cfg){
  const list = () => DB[cfg.key].slice().sort((a, b) => a.order - b.order);
  const renumber = () => list().forEach((x, i) => x.order = i + 1);
  const body = `<div class="panel"><div id="ol"></div></div><p class="muted" style="font-size:13.5px">${cfg.note}</p>`;
  const draw = () => { $('#ol').innerHTML = list().map((x, i, arr) => `<div class="faq-row" data-id="${esc(x.id)}"><span class="ordn">${i + 1}</span>${cfg.icon ? `<span class="ib" style="background:var(--sand);color:var(--maroon)">${ico(x.icon)}</span>` : ''}<div class="q"><b>${esc(x[cfg.a])}</b><span>${esc(x[cfg.b])}</span></div>
    ${sw('data-pub aria-label="Published"', x.published)}<button class="ib" data-up ${i === 0 ? 'disabled' : ''} aria-label="Move up">${ico('up')}</button><button class="ib" data-down ${i === arr.length - 1 ? 'disabled' : ''} aria-label="Move down">${ico('down')}</button><button class="ib" data-edit aria-label="Edit">${ico('edit')}</button><button class="ib" data-del aria-label="Delete">${ico('trash')}</button></div>`).join('') || `<div class="empty" style="border:0">Nothing here yet.</div>`; };
  const edit = x => {
    const isNew = !x; x = x || {id:uid(cfg.key[0]), [cfg.a]:'', [cfg.b]:'', icon:'sparkle', published:true, order:DB[cfg.key].length + 1};
    modal(`<h3>${isNew ? 'Add ' : 'Edit '}${cfg.noun}</h3><form class="form" id="mf">
      <div class="fld"><label for="m-a">${cfg.aLabel}</label><input class="inp" id="m-a" required value="${esc(x[cfg.a])}"></div>
      <div class="fld"><label for="m-b">${cfg.bLabel}</label><textarea class="inp" id="m-b">${esc(x[cfg.b])}</textarea></div>
      ${cfg.icon ? `<div class="fld"><label for="m-i">Icon</label><select class="inp" id="m-i">${ICON_KEYS.map(k => `<option ${k === x.icon ? 'selected' : ''}>${k}</option>`).join('')}</select></div>` : ''}
      <div class="checkrow"><label>${sw('id="m-p"', x.published)} Published</label></div>
      <div class="acts"><button type="button" class="btn btn-ghost btn-sm" data-close>Cancel</button><button class="btn btn-primary btn-sm" type="submit">${isNew ? 'Add' : 'Save'}</button></div></form>`,
    (bg, close) => { $('#mf', bg).onsubmit = async e => { e.preventDefault(); const a = $('#m-a', bg).value.trim(); if(!a){ toast(cfg.aLabel + ' is required.'); return; } x[cfg.a] = a; x[cfg.b] = $('#m-b', bg).value.trim(); x.published = $('#m-p', bg).checked; if(cfg.icon) x.icon = $('#m-i', bg).value; if(isNew) DB[cfg.key].push(x); if(await save()){ close(); draw(); toast(isNew ? cfg.noun + ' added.' : 'Changes saved.'); } }; });
  };
  return {html:adminLayout(cfg.key, cfg.title, body, `<button class="btn btn-primary btn-sm" id="addM">${ico('plus')} Add ${cfg.noun.toLowerCase()}</button>`), after:() => {
    adminBind(); draw();
    $('#addM').onclick = () => edit(null);
    $('#ol').addEventListener('change', e => { if(!e.target.matches('[data-pub]')) return; const x = DB[cfg.key].find(y => y.id === e.target.closest('.faq-row').dataset.id); x.published = e.target.checked; save(); toast(x.published ? 'Published.' : 'Unpublished.'); });
    $('#ol').addEventListener('click', e => { const row = e.target.closest('.faq-row'); if(!row) return; const L = list(); const i = L.findIndex(y => y.id === row.dataset.id); const x = L[i];
      if(e.target.closest('[data-up]') && i > 0){ [L[i - 1].order, x.order] = [x.order, L[i - 1].order]; renumber(); save(); draw(); }
      if(e.target.closest('[data-down]') && i < L.length - 1){ [L[i + 1].order, x.order] = [x.order, L[i + 1].order]; renumber(); save(); draw(); }
      if(e.target.closest('[data-edit]')) edit(x);
      if(e.target.closest('[data-del]')) confirmBox(`Delete "${x[cfg.a]}"?`, () => { DB[cfg.key] = DB[cfg.key].filter(y => y !== x); renumber(); save(); draw(); toast('Deleted.'); }); });
  }};
}
const adminFaqs = () => orderedManager({key:'faqs', title:'FAQs', noun:'FAQ', a:'q', b:'a', aLabel:'Question', bLabel:'Answer', note:'Published FAQs appear on the homepage in this order.'});
const adminFeatures = () => orderedManager({key:'features', title:'Features', noun:'Feature', a:'title', b:'desc', aLabel:'Title', bLabel:'Short description', icon:true, note:'Published features appear in the homepage features grid in this order.'});

/* ---------- admin: settings ---------- */
function adminSettings(){
  const s = S();
  const f = (id, label, val, help, type) => `<div class="fld"><label for="${id}">${label}</label>${type === 'ta' ? `<textarea class="inp" id="${id}">${esc(val)}</textarea>` : `<input class="inp" id="${id}" type="${type || 'text'}" value="${esc(val)}">`}${help ? `<span class="help">${help}</span>` : ''}</div>`;
  const body = `<form id="sf" class="panel"><div class="panel-b form">
    <div class="fsec" style="border:0;padding:0;margin:0"><h3>Business details</h3><p>Used across the website, footer and WhatsApp ordering.</p>
      <div class="row2">${f('s-brand', 'Brand name', s.brand)}${f('s-wa', 'WhatsApp business number', s.whatsapp, 'Country code and number, digits only. Example: 919876543210. Every order button uses this number.')}</div>
      <div class="row2" style="margin-top:14px">${f('s-email', 'Email', s.email, '', 'email')}${f('s-ig', 'Instagram URL', s.instagram, '', 'url')}</div>
      <div class="fld" style="margin-top:14px"><span class="lbl">Logo</span><div class="upl"><div class="pv logo" id="lpv">${s.logo ? `<img src="${s.logo}" alt="">` : `<span style="display:grid;place-items:center;height:100%;color:var(--maroon)">${ORN.logo()}</span>`}</div><input type="file" id="s-logo" accept="image/*"><button type="button" class="btn btn-ghost btn-sm" id="s-rm" ${s.logo ? '' : 'hidden'}>Use default logo</button></div></div></div>
    <div class="fsec"><h3>Website content</h3><p>Hero section and footer text on the homepage.</p>
      <div class="row2">${f('s-he', 'Hero eyebrow', s.heroEyebrow)}${f('s-ht', 'Hero title', s.heroTitle)}</div>
      <div style="margin-top:14px">${f('s-hd', 'Hero description', s.heroDesc, '', 'ta')}</div>
      <div class="row2" style="margin-top:14px">${f('s-c1', 'Primary button text', s.ctaPrimary)}${f('s-c2', 'Secondary button text (opens WhatsApp)', s.ctaSecondary)}</div>
      <div style="margin-top:14px">${f('s-ft', 'Footer description', s.footerText, '', 'ta')}</div></div>
    <div class="fsec"><h3>Your admin password</h3><p>Logged in as ${esc(session().email)}. Leave empty to keep your current password. To add or remove admins, use the admins table in Supabase.</p>
      <div class="row2">${f('s-ap', 'New password', '', 'At least 8 characters.', 'password')}<div></div></div></div>
    <div class="form-foot"><button class="btn btn-primary btn-sm" type="submit">Save settings</button></div>
  </div></form>
  <div class="panel"><div class="panel-h"><h2>Database</h2></div><div class="panel-b" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><p class="muted" style="flex:1;min-width:240px">Everything here is stored in your Supabase database and storage. If someone else edited the site, load the latest version.</p><button class="btn btn-ghost btn-sm" id="reset">${ico('refresh')} Load latest data</button></div></div>`;
  return {html:adminLayout('settings', 'Settings', body), after:() => {
    adminBind(); let logo = s.logo;
    $('#s-logo').onchange = async e => { const fl = e.target.files[0]; if(!fl) return; try { logo = await readImage(fl, 300); $('#lpv').innerHTML = `<img src="${logo}" alt="">`; $('#s-rm').hidden = false; } catch(err){ toast('That file could not be read. Try a PNG or SVG.'); } };
    $('#s-rm').onclick = () => { logo = ''; $('#s-logo').value = ''; $('#lpv').innerHTML = `<span style="display:grid;place-items:center;height:100%;color:var(--maroon)">${ORN.logo()}</span>`; $('#s-rm').hidden = true; };
    $('#sf').onsubmit = async e => { e.preventDefault();
      const wa = $('#s-wa').value.replace(/\D/g, ''); if(wa.length < 10){ toast('Enter the WhatsApp number with country code, for example 919876543210.'); $('#s-wa').focus(); return; }
      const pw = $('#s-ap').value; if(pw && pw.length < 8){ toast('Use a password with at least 8 characters.'); return; }
      Object.assign(DB.settings, {brand:$('#s-brand').value.trim() || 'Aamantran', whatsapp:wa, email:$('#s-email').value.trim(), instagram:$('#s-ig').value.trim(), logo, heroEyebrow:$('#s-he').value.trim(), heroTitle:$('#s-ht').value.trim() || 'Digital Indian Wedding Invitations', heroDesc:$('#s-hd').value.trim(), ctaPrimary:$('#s-c1').value.trim() || 'Browse Templates', ctaSecondary:$('#s-c2').value.trim() || 'Create Your Invite', footerText:$('#s-ft').value.trim()});
      if(pw){ const {error} = await sb.auth.updateUser({password:pw}); if(error){ toast('Password not changed: ' + error.message); return; } }
      if(await save()){ toast(pw ? 'Settings and password saved.' : 'Settings saved.'); router(); } };
    $('#reset').onclick = async () => { try { await loadAll(); toast('Latest data loaded.'); router(); } catch(e){ toast('Could not load data: ' + e.message); } };
  }};
}

/* ---------- router ---------- */
function adminRoute(sub, q){
  if(!session()){ location.hash = '#/admin/login'; return {html:''}; }
  document.title = 'Admin | ' + S().brand;
  let m;
  if(sub === '' || sub === '/') return adminDash();
  if(sub === '/templates') return adminTemplates(q);
  if(sub === '/templates/new') return adminTemplateForm(null, q);
  if((m = sub.match(/^\/templates\/([\w-]+)\/edit$/))) return adminTemplateForm(m[1], q);
  if(sub === '/orders') return adminOrders(q);
  if(sub === '/blogs') return adminBlogs();
  if(sub === '/blogs/new') return adminBlogForm(null);
  if((m = sub.match(/^\/blogs\/([\w-]+)\/edit$/))) return adminBlogForm(m[1]);
  if(sub === '/faqs') return adminFaqs();
  if(sub === '/features') return adminFeatures();
  if(sub === '/settings') return adminSettings();
  return {html:adminLayout('', 'Page not found', `<div class="empty">This admin page does not exist. <a href="#/admin">Go to the dashboard</a></div>`), after:adminBind};
}
const ROUTES = [
  [/^\/$/, (m, q) => pageHome(q)],
  [/^\/templates\/?$/, () => pageListing('all')],
  [/^\/templates\/(websites|videos|cards)$/, m => pageListing(m[1])],
  [/^\/template\/([\w-]+)$/, m => pageDetail(m[1])],
  [/^\/demo\/([\w-]+)$/, m => pageDemo(m[1])],
  [/^\/blogs$/, () => pageBlogs()],
  [/^\/blog\/([\w-]+)$/, m => pageBlog(m[1])],
  [/^\/about$/, () => pageAbout()],
  [/^\/privacy$/, () => pagePrivacy()],
  [/^\/terms$/, () => pageTerms()],
  [/^\/admin\/login$/, () => pageAdminLogin()],
  [/^\/admin(\/.*)?$/, (m, q) => adminRoute(m[1] || '', q)]
];
let lastPath = null;
function router(){
  while(TIMERS.length) TIMERS.pop()();
  $$('.modal-bg').forEach(x => x.remove());
  const raw = decodeURIComponent(location.hash.replace(/^#/, '')) || '/';
  const [path, qs] = raw.split('?'); const q = new URLSearchParams(qs || '');
  let res = null;
  for(const [re, fn] of ROUTES){ const m = path.match(re); if(m){ res = fn(m, q); break; } }
  if(!res) res = pageNotFound();
  if(!res.html && !res.after) return;
  const app = $('#app'); app.innerHTML = res.html;
  if(path !== lastPath || !q.get('to')) window.scrollTo(0, 0);
  lastPath = path;
  mountLive(app);
  bindPublic();
  if(res.after) res.after();
}
function bindPublic(){
  const b = $('#burger'), mn = $('#mnav');
  if(b && mn){ b.onclick = () => { const o = mn.classList.toggle('open'); b.setAttribute('aria-expanded', o); b.innerHTML = ico(o ? 'close' : 'menu'); document.body.style.overflow = o ? 'hidden' : ''; }; $$('a', mn).forEach(a => a.addEventListener('click', () => { mn.classList.remove('open'); document.body.style.overflow = ''; })); }
  document.body.style.overflow = '';
}
document.addEventListener('click', e => {
  const q = e.target.closest('[data-acc]'); if(!q) return;
  const acc = q.closest('.acc'); const open = acc.classList.toggle('open'); q.setAttribute('aria-expanded', open);
});
window.addEventListener('scroll', () => { const h = $('#hdr'); if(h) h.classList.toggle('scrolled', window.scrollY > 10); }, {passive:true});
let READY = false;
window.addEventListener('hashchange', () => { if(READY) router(); });
function fatal(msg){ $('#app').innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;padding:30px;text-align:center"><div style="max-width:480px"><div style="width:80px;margin:0 auto 18px;color:var(--gold)">${orn('arch')}</div><h1 style="font-size:32px;font-weight:500">${esc(msg)}</h1><button class="btn btn-primary" style="margin-top:22px" onclick="location.reload()">Refresh</button></div></div>`; }
async function boot(){
  $('#app').innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;color:var(--gold)" aria-label="Loading"><div style="width:90px;animation:pfloat 2s ease-in-out infinite">${orn('arch')}</div></div>`;
  if(!sb){ fatal('The database library could not load. Check your internet connection and refresh.'); return; }
  try { await refreshAuth(); await loadAll(); }
  catch(e){ console.error(e); fatal(/schema cache|does not exist/i.test(e.message || '') ? 'The database is not set up yet. Run setup.sql in the Supabase SQL Editor, then refresh this page.' : 'Could not reach the database: ' + (e.message || 'network error') + '. Refresh to try again.'); return; }
  READY = true; router();
}
boot();
</script>
