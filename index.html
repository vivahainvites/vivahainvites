<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aamantran | Digital Indian Wedding Invitations</title>
<meta name="description" content="Beautiful digital Indian wedding invitations. Website invitations, video invitations and digital cards, ordered on WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&family=Great+Vibes&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7F0; --surface:#FFFFFF; --sand:#F3E9D8; --line:#E6D8C0;
  --maroon:#6B1426; --maroon-2:#4B0E1B; --gold:#B8893B; --gold-soft:#DCC28C;
  --ink:#2A1A17; --muted:#6E5D55; --on-maroon:#FBEFD9;
  --shadow:0 18px 40px -22px rgba(75,14,27,.35);
  --r-lg:22px; --r-md:14px; --r-sm:9px;
  --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans:'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1113; --surface:#241719; --sand:#2E1E21; --line:#3D2A2E;
    --maroon:#A8374C; --maroon-2:#7E2335; --gold:#D2A95B; --gold-soft:#8C7240;
    --ink:#F4E9DB; --muted:#BFAEA2; --on-maroon:#FFF3E2;
    --shadow:0 18px 40px -22px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#1A1113; --surface:#241719; --sand:#2E1E21; --line:#3D2A2E;
  --maroon:#A8374C; --maroon-2:#7E2335; --gold:#D2A95B; --gold-soft:#8C7240;
  --ink:#F4E9DB; --muted:#BFAEA2; --on-maroon:#FFF3E2;
  --shadow:0 18px 40px -22px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.12;margin:0;letter-spacing:-.01em}
p{margin:0}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 24px;border-radius:999px;border:1px solid transparent;font-weight:500;font-size:15px;text-decoration:none;cursor:pointer;transition:transform .2s, background .2s, box-shadow .2s, color .2s;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--maroon);color:var(--on-maroon);box-shadow:0 10px 24px -12px var(--maroon)}
.btn-primary:hover{background:var(--maroon-2);transform:translateY(-1px)}
.btn-ghost{border-color:var(--line);background:var(--surface);color:var(--ink)}
.btn-ghost:hover{border-color:var(--gold);color:var(--maroon)}
.btn-gold{background:var(--gold);color:#2A1A10}
.btn-gold:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-wa{background:#1F8F55;color:#fff}
.btn-wa:hover{background:#177346}
.btn-sm{padding:8px 15px;font-size:14px}
.btn-block{width:100%}

/* header */
.hdr{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .3s}
.hdr.scrolled{border-bottom-color:var(--line)}
.hdr-in{display:flex;align-items:center;gap:22px;height:74px}
.logo{display:flex;align-items:center;gap:0px;text-decoration:none;font-family:var(--serif);font-size:26px;font-weight:600;color:var(--maroon)}
.logo svg,.logo img{width:70px;height:70px;object-fit:contain}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{padding:8px 11px;border-radius:999px;text-decoration:none;font-size:14.5px;color:var(--muted);transition:color .2s,background .2s}
.nav a:hover,.nav a.on{color:var(--maroon);background:var(--sand)}
.hdr-cta{display:flex;gap:8px;align-items:center}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-decoration:none;color:var(--ink)}
.icon-btn svg{width:19px;height:19px}
.burger{display:none}
.mnav{position:fixed;inset:74px 0 0 0;background:var(--bg);z-index:49;padding:18px 20px 40px;display:flex;flex-direction:column;gap:4px;transform:translateY(-8px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;overflow:auto}
.mnav.open{opacity:1;transform:none;pointer-events:auto}
.mnav a.l{padding:15px 6px;border-bottom:1px solid var(--line);text-decoration:none;font-family:var(--serif);font-size:24px}
.mnav .btn{margin-top:18px}
@media (max-width:1080px){.nav{display:none}.burger{display:grid}.hdr-cta .btn-browse{display:none}.hdr-cta{margin-left:auto}}

/* hero */
.hero{position:relative;padding:56px 0 90px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 70% at 85% 30%,color-mix(in srgb,var(--gold-soft) 38%,transparent),transparent 70%),radial-gradient(40% 50% at 10% 90%,color-mix(in srgb,var(--maroon) 10%,transparent),transparent 70%);pointer-events:none}
.hero-grid{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--gold);font-weight:500;font-size:15px}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
.hero h1{font-size:clamp(46px,6.4vw,86px);font-weight:500;margin:18px 0 22px;color:var(--ink)}
.hero h1 .l2{display:block;font-style:italic;color:var(--maroon)}
.hero p.lead{font-size:18px;color:var(--muted);max-width:30em}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.hero-meta{display:flex;gap:26px;margin-top:40px;flex-wrap:wrap}
.hero-meta div{font-size:14px;color:var(--muted)}
.hero-meta strong{display:block;font-family:var(--serif);font-size:28px;color:var(--ink);font-weight:600}
.hero-stage{position:relative;display:grid;place-items:center;min-height:620px}
.hero-stage .deco{position:absolute;pointer-events:none;color:var(--gold)}
.hero-stage .deco svg{width:100%;height:100%}
@keyframes drift{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(6deg)}}
.deco.d1{width:120px;height:120px;top:20px;left:4%;animation:drift 9s ease-in-out infinite;opacity:.9}
.deco.d2{width:64px;height:64px;bottom:70px;left:0;animation:drift 7s ease-in-out infinite reverse;color:var(--maroon)}
.deco.d3{width:90px;height:90px;top:60px;right:2%;animation:drift 8s ease-in-out infinite}
.deco.d4{width:34px;height:34px;bottom:120px;right:6%;color:var(--maroon);animation:drift 6s ease-in-out infinite}
.deco.d5{width:26px;height:26px;top:48%;left:10%;animation:drift 5s ease-in-out infinite}
.deco.d6{width:150px;height:150px;bottom:-10px;right:-10px;opacity:.5;animation:drift 12s ease-in-out infinite}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.hero{padding-top:30px}.hero-stage{min-height:560px}}

/* phone */
.phone{position:relative;width:300px;aspect-ratio:9/19;min-height:0;border-radius:46px;background:#16100F;padding:11px;box-shadow:0 50px 80px -40px rgba(60,10,20,.6),0 0 0 1.5px #3a2a26 inset,0 0 0 4px #0c0807;flex:none}
.phone::before{content:"";position:absolute;top:18px;left:50%;transform:translateX(-50%);width:92px;height:25px;background:#0a0707;border-radius:20px;z-index:3}
.phone::after{content:"";position:absolute;right:-4px;top:120px;width:4px;height:60px;background:#2a1f1c;border-radius:0 3px 3px 0}
.phone .scr{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:#fff}
.phone .scr .scroll{height:100%;overflow-y:auto;scrollbar-width:none}
.phone .scr .scroll::-webkit-scrollbar{display:none}
.phone.float{animation:pfloat 6s ease-in-out infinite}
@keyframes pfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.phone.auto .scroll{overflow:hidden}
.phone.auto .scroll > .inv{animation:autoscroll 38s ease-in-out infinite alternate}
@keyframes autoscroll{0%,8%{transform:translateY(0)}100%{transform:translateY(calc(-100% + var(--sh,600px)))}}
.phone.lg{width:330px}
.phone .scr iframe.live{display:block;width:100%;height:100%;border:0;background:#fff}
@media (max-width:420px){.phone{width:270px}.phone.lg{width:290px}}

/* sections */
.sec{padding:96px 0}
.sec.alt{background:var(--sand)}
.sec-head{max-width:640px;margin:0 auto 52px;text-align:center}
.sec-head h2{font-size:clamp(36px,4.6vw,56px);font-weight:500}
.sec-head p{margin-top:14px;color:var(--muted);font-size:17px}
.orn-rule{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold);margin-bottom:16px}
.orn-rule::before,.orn-rule::after{content:"";width:46px;height:1px;background:currentColor;opacity:.6}
.orn-rule svg{width:18px;height:18px}

/* collections */
.coll-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.coll{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:28px 28px var(--r-lg) var(--r-lg);overflow:hidden;text-decoration:none;color:inherit;transition:transform .35s,box-shadow .35s}
.coll:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.coll .vis{height:300px;display:grid;place-items:center;overflow:hidden;position:relative;border-radius:160px 160px 0 0;margin:14px 14px 0;background:linear-gradient(160deg,var(--sand),color-mix(in srgb,var(--gold-soft) 40%,var(--sand)))}
.coll .vis > *{transition:transform .6s}
.coll:hover .vis > *{transform:scale(1.04)}
.coll .body{padding:24px 26px 28px;display:flex;flex-direction:column;gap:10px;flex:1}
.coll h3{font-size:30px}
.coll p{color:var(--muted)}
.coll .btn{margin-top:auto;align-self:flex-start}
.mini-phone{width:150px;aspect-ratio:9/18.5;min-height:0;border-radius:24px;background:#16100F;padding:6px;box-shadow:0 30px 50px -25px rgba(60,10,20,.6);transform:translateY(40px)}
.mini-phone .scr{border-radius:19px;overflow:hidden;height:100%}
.mini-video{width:78%;aspect-ratio:9/13;min-height:0;border-radius:16px;overflow:hidden;box-shadow:0 30px 50px -25px rgba(60,10,20,.6);transform:translateY(30px)}
.mini-card{width:62%;transform:rotate(-4deg) translateY(24px);box-shadow:0 30px 50px -25px rgba(60,10,20,.55)}
@media (max-width:900px){.coll-grid{grid-template-columns:1fr;max-width:520px;margin:auto}}

/* how it works */
.steps{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.steps::before{content:"";position:absolute;top:44px;left:16%;right:16%;border-top:1.5px dashed var(--gold-soft)}
.step{position:relative;text-align:center;padding:0 12px}
.step .ic{position:relative;width:88px;height:88px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--maroon);box-shadow:0 0 0 8px var(--bg)}
.sec.alt .step .ic{box-shadow:0 0 0 8px var(--sand)}
.step .ic svg{width:32px;height:32px}
.step .n{position:absolute;top:-4px;right:-4px;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#2A1A10;font-size:13px;font-weight:600;display:grid;place-items:center}
.step h3{font-size:28px;margin-bottom:8px}
.step p{color:var(--muted);max-width:28ch;margin:auto}
.center{text-align:center}
@media (max-width:800px){.steps{grid-template-columns:1fr;gap:40px}.steps::before{top:40px;bottom:40px;left:50%;right:auto;border-top:0;border-left:1.5px dashed var(--gold-soft)}}

/* features */
.feat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.feat{background:var(--surface);padding:28px 24px;display:flex;flex-direction:column;gap:10px;transition:background .25s}
.feat:hover{background:color-mix(in srgb,var(--sand) 60%,var(--surface))}
.feat .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--sand);color:var(--maroon)}
.feat .ic svg{width:22px;height:22px}
.feat h3{font-size:22px}
.feat p{color:var(--muted);font-size:14.5px}

/* faq */
.faq{max-width:820px;margin:auto;display:flex;flex-direction:column;gap:12px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;transition:border-color .25s}
.acc.open{border-color:var(--gold-soft)}
.acc button.q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 22px;background:none;border:0;text-align:left;cursor:pointer;font-family:var(--serif);font-size:21px;font-weight:600}
.acc .pm{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:transform .3s,background .3s}
.acc .pm svg{width:14px;height:14px}
.acc.open .pm{transform:rotate(45deg);background:var(--maroon);color:var(--on-maroon);border-color:var(--maroon)}
.acc .a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.acc.open .a{grid-template-rows:1fr}
.acc .a > div{overflow:hidden}
.acc .a p{padding:0 22px 22px;color:var(--muted)}

/* cta band */
.cta-band{position:relative;border-radius:32px;overflow:hidden;padding:88px 30px;text-align:center;color:var(--on-maroon);background:radial-gradient(80% 120% at 50% 0%,#8C2336,#4B0E1B 70%)}
.cta-band .pat{position:absolute;inset:0;opacity:.14;color:#E9C98A;pointer-events:none;background-repeat:repeat}
.cta-band h2{position:relative;font-size:clamp(38px,5vw,62px);font-weight:500}
.cta-band p{position:relative;margin:16px auto 30px;max-width:34em;opacity:.85;font-size:18px}
.cta-band .btn{position:relative}
.cta-band .arch{position:absolute;width:210px;opacity:.22;color:#E9C98A}
.cta-band .arch.l{left:26px;bottom:26px}.cta-band .arch.r{right:26px;bottom:26px;transform:scaleX(-1)}
@media (max-width:820px){.cta-band .arch{display:none}}

/* quick links + footer */
.ql{padding:70px 0 40px;border-top:1px solid var(--line)}
.ql-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:34px}
.ql h4{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--gold);margin-bottom:14px}
.ql ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.ql ul a{text-decoration:none;color:var(--muted)}
.ql ul a:hover{color:var(--maroon)}
.ql .brand p{color:var(--muted);margin:14px 0 18px;max-width:30ch}
.socials{display:flex;gap:10px}
.foot{border-top:1px solid var(--line);padding:22px 0;font-size:14px;color:var(--muted)}
.foot .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.foot a{text-decoration:none;color:var(--muted)}
.foot a:hover{color:var(--maroon)}
.foot nav{display:flex;gap:18px}
@media (max-width:800px){.ql-grid{grid-template-columns:1fr 1fr}.ql .brand{grid-column:1/-1}}

/* page head + crumbs */
.phead{padding:44px 0 34px}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--muted);margin-bottom:18px}
.crumbs a{text-decoration:none;color:var(--muted)}
.crumbs a:hover{color:var(--maroon)}
.crumbs span.sep{opacity:.5}
.phead h1{font-size:clamp(40px,5vw,64px);font-weight:500}
.phead p{color:var(--muted);font-size:18px;margin-top:10px;max-width:38em}

/* listing */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);text-decoration:none;font-size:14.5px;cursor:pointer}
.tab.on{background:var(--maroon);border-color:var(--maroon);color:var(--on-maroon)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 0 26px;border-bottom:1px solid var(--line);margin-bottom:34px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px;color:var(--muted);transition:all .2s}
.chip:hover{color:var(--maroon);border-color:var(--gold-soft)}
.chip.on{background:var(--sand);color:var(--maroon);border-color:var(--gold)}
.sel{padding:10px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-size:14.5px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:30px}
.tcard{display:flex;flex-direction:column;text-decoration:none;color:inherit}
.tcard .thumb{position:relative;aspect-ratio:4/5;border-radius:var(--r-lg);overflow:hidden;background:var(--sand)}
.tcard .thumb > .tin{position:absolute;inset:0;transition:transform .7s ease}
.tcard:hover .thumb > .tin{transform:scale(1.05)}
.tcard .thumb img{width:100%;height:100%;object-fit:cover}
.tcard .badge{position:absolute;top:14px;left:14px;z-index:2;padding:5px 11px;border-radius:999px;background:rgba(255,250,240,.92);color:#6B1426;font-size:12.5px;font-weight:500}
.tcard .play{position:absolute;z-index:2;right:14px;bottom:14px;width:50px;height:50px;border-radius:50%;background:rgba(255,248,235,.9);display:grid;place-items:center;color:#6B1426;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .3s}
.tcard:hover .play{transform:scale(1.08)}
.tcard .play svg{width:24px;height:24px;margin-left:3px}
.tcard .meta{padding:16px 4px 0;display:flex;flex-direction:column;gap:6px}
.tcard .meta .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tcard h3{font-size:25px}
.tcard .price{font-weight:600;color:var(--maroon);white-space:nowrap}
.tcard p{color:var(--muted);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcard .view{margin-top:6px;font-size:14.5px;font-weight:500;color:var(--maroon);display:inline-flex;gap:6px;align-items:center}
.tcard .view svg{width:16px;height:16px;transition:transform .25s}
.tcard:hover .view svg{transform:translateX(3px)}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;border:1px dashed var(--line);border-radius:var(--r-lg);color:var(--muted)}
.empty .btn{margin-top:16px}

/* detail */
.detail{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center;padding:10px 0 80px}
.detail .info .pill{display:inline-flex;gap:8px;align-items:center;padding:6px 13px;border-radius:999px;background:var(--sand);color:var(--maroon);font-size:13.5px;font-weight:500}
.detail .info .pill svg{width:16px;height:16px}
.detail h1{font-size:clamp(40px,4.8vw,64px);font-weight:500;margin:18px 0 16px}
.detail .desc{color:var(--muted);font-size:18px;max-width:32em}
.detail .price{font-family:var(--serif);font-size:48px;font-weight:600;color:var(--maroon);margin:26px 0 4px;line-height:1}
.detail .price-note{font-size:14px;color:var(--muted)}
.detail .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.detail .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}
.detail .tags span{font-size:13px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.detail .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px;max-width:480px}
.detail .quick div{border-top:1px solid var(--line);padding-top:12px;font-size:13.5px;color:var(--muted)}
.detail .quick strong{display:block;color:var(--ink);font-size:15px;font-weight:500}
.detail .stage{display:flex;flex-direction:column;align-items:center;gap:22px;position:relative;padding:30px 0}
.detail .stage::before{content:"";position:absolute;inset:0 6%;border-radius:220px 220px 30px 30px;background:linear-gradient(180deg,var(--sand),transparent)}
.detail .stage > *{position:relative}
.hint{font-size:13px;color:var(--muted)}
@media (max-width:900px){.detail{grid-template-columns:1fr;gap:20px}}
.two{display:grid;grid-template-columns:.9fr 1.1fr;gap:60px;align-items:start}
.two h2{font-size:clamp(34px,4vw,50px);font-weight:500}
.prose p{color:var(--muted);font-size:17.5px;margin-bottom:16px;font-family:var(--serif);font-size:20px;line-height:1.6;color:var(--ink)}
@media (max-width:900px){.two{grid-template-columns:1fr;gap:20px}}
.who-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.who{padding:24px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.who .ic{flex:none;width:38px;height:38px;border-radius:50%;background:var(--sand);color:var(--maroon);display:grid;place-items:center}
.who .ic svg{width:18px;height:18px}
.who p{font-size:15.5px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px 30px;max-width:900px;margin:auto}
.checks li{list-style:none;display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.checks li svg{flex:none;width:20px;height:20px;color:var(--gold)}
.checks{padding:0}

/* demo */
.demo-bar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(20,12,12,.86);backdrop-filter:blur(10px);color:#F5E9D6}
.demo-bar a.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:14px;opacity:.9}
.demo-bar a.back svg{width:17px;height:17px}
.demo-bar .t{flex:1;text-align:center;font-family:var(--serif);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo-bar .tag{font-size:12px;opacity:.7;margin-left:6px}
@media (max-width:640px){.demo-bar .t{display:none}.demo-bar{justify-content:space-between}}
.demo-float{position:fixed;right:18px;bottom:18px;z-index:61;box-shadow:0 14px 34px -10px rgba(0,0,0,.45)}
.demo-stage{min-height:calc(100vh - 58px);display:grid;place-items:center;padding:30px 16px 90px}

/* blog */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:30px}
.bcard{text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:14px}
.bcard .cov{aspect-ratio:16/10;border-radius:var(--r-lg);overflow:hidden;position:relative}
.bcard .cov > *{width:100%;height:100%;object-fit:cover;transition:transform .7s}
.bcard:hover .cov > *{transform:scale(1.05)}
.bcard .cat{font-size:13px;color:var(--gold);font-weight:500}
.bcard h3{font-size:27px}
.bcard p{color:var(--muted)}
.article{max-width:720px;margin:0 auto;padding-bottom:90px}
.article .cov{aspect-ratio:16/8;border-radius:var(--r-lg);overflow:hidden;margin:10px 0 40px}
.article .cov > *{width:100%;height:100%;object-fit:cover}
.article .body h2{font-size:34px;margin:38px 0 12px}
.article .body p{font-family:var(--serif);font-size:21px;line-height:1.65;margin-bottom:18px}
.article .body ul{font-family:var(--serif);font-size:20px;padding-left:22px}
.gen-cover{display:grid;place-items:center}
.gen-cover svg{width:34%;height:auto}

/* toast + modal */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#2A1A17;color:#FBEFD9;padding:12px 20px;border-radius:12px;font-size:14.5px;z-index:200;opacity:0;transition:all .3s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-bg{position:fixed;inset:0;background:rgba(25,12,14,.55);z-index:150;display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:var(--r-lg);width:min(640px,100%);max-height:90vh;overflow:auto;padding:28px;box-shadow:0 40px 80px -30px rgba(0,0,0,.5)}
.modal h3{font-size:28px;margin-bottom:18px}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
/* ===== invitation renderer ===== */
.inv{--ib:#5E0F1E;--ib2:#3E0913;--ii:#F6E7C9;--ia:#D6AA55;--im:#E3C9A8;--if:'Marcellus',serif;background:var(--ib);color:var(--ii);font-family:var(--if);text-align:center;font-size:16px;line-height:1.55;position:relative}
.inv.sm{font-size:10.5px}
.inv.xs{font-size:7px}
.inv *{box-sizing:border-box}
.inv h3{font-family:var(--if);font-weight:400;font-size:2.1em;color:var(--ia);margin:0 0 .5em;letter-spacing:.01em}
.inv .kick{font-size:.82em;letter-spacing:.22em;color:var(--im);text-transform:uppercase}
.inv .cover{position:relative;min-height:42em;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5em 2em 4em;background:radial-gradient(90% 70% at 50% 38%,var(--ib),var(--ib2));overflow:hidden}
.inv.full .cover{min-height:100vh}
.inv .cover .frame{position:absolute;inset:1.4em;border:1px solid color-mix(in srgb,var(--ia) 55%,transparent);border-radius:12em 12em 1em 1em;pointer-events:none}
.inv .cover .frame::after{content:"";position:absolute;inset:.45em;border:1px solid color-mix(in srgb,var(--ia) 25%,transparent);border-radius:12em 12em .7em .7em}
.inv .orn{color:var(--ia);width:7em;margin:0 auto 1.4em}
.inv .orn svg{width:100%;height:auto;display:block}
.inv .orn.wide{width:13em}
.inv .greet{font-size:1.05em;letter-spacing:.24em;text-transform:uppercase;color:var(--ia);margin-bottom:1.2em}
.inv .with{font-size:.95em;color:var(--im);font-style:italic;max-width:22em;margin:0 auto 1.4em}
.inv .names{font-family:'Great Vibes',cursive;font-size:4.4em;line-height:1.05;color:var(--ia);font-weight:400}
.inv .names.plain{font-family:var(--if);font-size:3.4em;color:var(--ii);letter-spacing:.02em}
.inv .amp{display:block;font-family:'Great Vibes',cursive;font-size:.62em;color:var(--im);margin:.1em 0}
.inv .date{margin-top:1.4em;font-size:1.15em;letter-spacing:.2em;text-transform:uppercase}
.inv .place{margin-top:.4em;color:var(--im);font-size:.95em}
.inv .scrollcue{margin-top:2.4em;font-size:.75em;letter-spacing:.3em;color:var(--im);text-transform:uppercase}
.inv .corner{position:absolute;width:9em;color:var(--ia);opacity:.35;pointer-events:none}
.inv .corner.tl{top:-2em;left:-2em}.inv .corner.br{bottom:-2em;right:-2em;transform:rotate(180deg)}
.inv .blk{padding:4.2em 2em;position:relative;border-top:1px solid color-mix(in srgb,var(--ia) 22%,transparent)}
.inv .blk.tint{background:var(--ib2)}
.inv .blk p{max-width:30em;margin:0 auto;color:var(--ii);opacity:.9}
.inv .cd{display:flex;justify-content:center;gap:.8em;margin-top:1.2em}
.inv .cd div{min-width:4.6em;padding:.9em .3em;border:1px solid color-mix(in srgb,var(--ia) 45%,transparent);border-radius:.7em}
.inv .cd b{display:block;font-size:2em;font-weight:400;color:var(--ia);line-height:1.1;font-variant-numeric:tabular-nums}
.inv .cd span{font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:var(--im)}
.inv .events{display:grid;gap:1em;max-width:34em;margin:1.4em auto 0}
.inv.full .events{grid-template-columns:repeat(auto-fit,minmax(15em,1fr));max-width:60em}
.inv .ev{padding:1.6em 1.2em;border-radius:6em 6em .8em .8em;border:1px solid color-mix(in srgb,var(--ia) 40%,transparent);background:color-mix(in srgb,var(--ib) 70%,var(--ib2))}
.inv .ev .ei{width:2.6em;height:2.6em;margin:0 auto .6em;color:var(--ia)}
.inv .ev .ei svg{width:100%;height:100%}
.inv .ev h4{font-family:var(--if);font-weight:400;font-size:1.5em;margin:0 0 .3em;color:var(--ii)}
.inv .ev .when{color:var(--ia);font-size:.95em}
.inv .ev .where{color:var(--im);font-size:.88em;margin-top:.2em}
.inv .venue-card{max-width:30em;margin:1.2em auto 0;border-radius:1em;overflow:hidden;border:1px solid color-mix(in srgb,var(--ia) 40%,transparent)}
.inv .map{height:11em;position:relative;background:
  linear-gradient(90deg,transparent 48%,color-mix(in srgb,var(--ia) 30%,transparent) 48% 52%,transparent 52%),
  linear-gradient(0deg,transparent 60%,color-mix(in srgb,var(--ia) 22%,transparent) 60% 63%,transparent 63%),
  linear-gradient(35deg,transparent 30%,color-mix(in srgb,var(--ia) 18%,transparent) 30% 33%,transparent 33%),
  var(--ib2)}
.inv .map .pin{position:absolute;left:50%;top:44%;transform:translate(-50%,-100%);width:2.4em;color:var(--ia)}
.inv .venue-card .vb{padding:1.2em}
.inv .venue-card h4{font-family:var(--if);font-weight:400;font-size:1.35em;margin:0 0 .2em}
.inv .ibtn{display:inline-flex;align-items:center;gap:.5em;margin-top:.9em;padding:.75em 1.5em;border-radius:99em;background:var(--ia);color:var(--ib2);text-decoration:none;font-family:'Jost',sans-serif;font-size:.9em;font-weight:500;border:0;cursor:pointer}
.inv .ibtn.o{background:transparent;color:var(--ia);border:1px solid var(--ia)}
.inv .gal{display:grid;grid-template-columns:1fr 1fr;gap:.6em;max-width:34em;margin:1.4em auto 0}
.inv.full .gal{grid-template-columns:repeat(3,1fr);max-width:54em}
.inv .gal div{aspect-ratio:3/4;border-radius:.8em;display:flex;align-items:flex-end;justify-content:center;padding:.8em;font-size:.82em;color:var(--ii);position:relative;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--ia) 45%,var(--ib)),var(--ib2))}
.inv .gal div:nth-child(2n){aspect-ratio:3/3.4;background:linear-gradient(200deg,color-mix(in srgb,var(--im) 40%,var(--ib)),var(--ib2))}
.inv .gal div svg{position:absolute;width:55%;top:22%;left:22.5%;opacity:.35;color:var(--ii)}
.inv .gal div span{position:relative}
.inv .fam{display:grid;grid-template-columns:1fr 1fr;gap:1.2em;max-width:34em;margin:1.2em auto 0}
.inv .fam h4{font-family:var(--if);font-weight:400;font-size:1.2em;color:var(--ia);margin:0 0 .3em}
.inv .fam p{font-size:.92em}
.inv form.rsvp{max-width:26em;margin:1.4em auto 0;display:grid;gap:.7em;text-align:left;font-family:'Jost',sans-serif}
.inv form.rsvp label{font-size:.85em;color:var(--im)}
.inv form.rsvp input,.inv form.rsvp select{width:100%;padding:.8em 1em;border-radius:.6em;border:1px solid color-mix(in srgb,var(--ia) 45%,transparent);background:color-mix(in srgb,var(--ib2) 60%,transparent);color:var(--ii);font-size:.95em;margin-top:.3em}
.inv form.rsvp .ibtn{justify-content:center;margin-top:.4em}
.inv .ok{padding:1.4em;border:1px solid var(--ia);border-radius:.8em;max-width:26em;margin:1.4em auto 0}
.inv .contact{display:flex;flex-wrap:wrap;justify-content:center;gap:1.4em;margin-top:1em}
.inv .contact div{font-size:.92em}
.inv .contact b{display:block;font-weight:400;color:var(--ia);font-size:1.1em}
.inv .endnote{padding:4em 2em 5em;background:var(--ib2)}
.inv .endnote .names{font-size:3em}
.inv .tag{margin-top:1em;color:var(--im);letter-spacing:.1em}
.inv .music{position:fixed;right:18px;bottom:80px;z-index:62;width:46px;height:46px;border-radius:50%;border:1px solid var(--ia);background:var(--ib2);color:var(--ia);display:grid;place-items:center;cursor:pointer}
.inv .music svg{width:20px;height:20px}
.inv .music.on{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* video */
.vid{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(90% 70% at 50% 40%,var(--ib),var(--ib2));color:var(--ii);font-family:var(--if);text-align:center;--ib:#171A2B;--ib2:#0D0F1C;--ii:#EDE3CF;--ia:#C9A45C;--im:#BFB39B;--if:'Marcellus',serif}
.vid .bgorn{position:absolute;width:130%;left:-15%;top:10%;color:var(--ia);opacity:.13;animation:slowspin 60s linear infinite}
@keyframes slowspin{to{transform:rotate(360deg)}}
.vid .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12% 10%;opacity:0;transform:scale(.97);transition:opacity 1s ease,transform 4s ease}
.vid .scene.on{opacity:1;transform:scale(1.02)}
.vid .scene .k{font-size:.8em;letter-spacing:.3em;text-transform:uppercase;color:var(--im);margin-bottom:.8em}
.vid .scene .big{font-family:'Great Vibes',cursive;font-size:3.6em;color:var(--ia);line-height:1.05}
.vid .scene .mid{font-size:1.9em;line-height:1.2}
.vid .scene .sm{font-size:1em;color:var(--im);margin-top:.6em}
.vid .scene .orn{width:6em;color:var(--ia);margin-bottom:1em}
.vid .scene .orn svg{width:100%;height:auto}
.vid .bar{position:absolute;left:8%;right:8%;bottom:5%;height:2px;background:color-mix(in srgb,var(--ii) 20%,transparent);border-radius:2px;overflow:hidden}
.vid .bar i{display:block;height:100%;width:0;background:var(--ia)}
.vid .ctrl{position:absolute;right:5%;bottom:8%;width:2.8em;height:2.8em;border-radius:50%;border:1px solid color-mix(in srgb,var(--ia) 60%,transparent);background:transparent;color:var(--ia);display:grid;place-items:center;cursor:pointer;font-size:inherit}
.vid .ctrl svg{width:45%;height:45%}
.vid.sm{font-size:10px}.vid.xs{font-size:8px}
.vid-full{width:min(420px,100%);aspect-ratio:9/16;min-height:0;border-radius:22px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.vid-full .vid{font-size:14px}

/* card */
.card-inv{--ib:#FFF8E7;--ib2:#F2E1B5;--ii:#4A3411;--ia:#B8862B;--im:#7A6440;--if:'Cormorant Garamond',serif;position:relative;aspect-ratio:5/7;min-height:0;background:radial-gradient(90% 70% at 50% 35%,var(--ib),var(--ib2));color:var(--ii);font-family:var(--if);text-align:center;padding:9% 9%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font-size:16px}
.card-inv::before{content:"";position:absolute;inset:3.2%;border:1.5px solid var(--ia);border-radius:.4em}
.card-inv::after{content:"";position:absolute;inset:4.6%;border:1px solid color-mix(in srgb,var(--ia) 45%,transparent);border-radius:.3em}
.card-inv > *{position:relative;z-index:1}
.card-inv .orn{width:5.5em;color:var(--ia);margin-bottom:.6em}
.card-inv .orn svg{width:100%;height:auto;display:block}
.card-inv .g{font-size:.78em;letter-spacing:.3em;text-transform:uppercase;color:var(--ia)}
.card-inv .inv-l{font-size:.84em;font-style:italic;color:var(--im);margin:.8em 0 .5em;max-width:22em}
.card-inv .n{font-family:'Great Vibes',cursive;font-size:3em;color:var(--ia);line-height:1.05}
.card-inv .n.plain{font-family:var(--if);font-size:2.3em;color:var(--ii)}
.card-inv .par{font-size:.72em;color:var(--im);margin:.25em 0}
.card-inv .d{margin-top:.8em;font-size:1.02em;letter-spacing:.14em;text-transform:uppercase}
.card-inv .v{font-size:.82em;color:var(--im);margin-top:.2em}
.card-inv .evs{display:flex;gap:.4em 1.1em;flex-wrap:wrap;justify-content:center;margin-top:.9em;font-size:.72em;border-top:1px solid color-mix(in srgb,var(--ia) 45%,transparent);padding-top:.7em}
.card-inv .evs b{color:var(--ia);font-weight:600}
.card-inv .cor{position:absolute;width:22%;color:var(--ia);opacity:.55;z-index:0}
.card-inv .cor.a{top:5%;left:5%}.card-inv .cor.b{top:5%;right:5%;transform:scaleX(-1)}.card-inv .cor.c{bottom:5%;left:5%;transform:scaleY(-1)}.card-inv .cor.d{bottom:5%;right:5%;transform:scale(-1)}
.card-inv.sm{font-size:9px}.card-inv.xs{font-size:6px}
.card-full{width:min(520px,100%);box-shadow:0 40px 80px -30px rgba(0,0,0,.45);border-radius:6px;overflow:hidden}
.card-full .card-inv{font-size:clamp(11px,3.3vw,19px)}
.phone .card-wrap{height:100%;display:grid;place-items:center;padding:30px 12px;background:linear-gradient(#EDE4D6,#D9CBB5)}
.phone .card-wrap .card-inv{width:100%;font-size:10px;box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}

[hidden]{display:none!important}
/* uploaded videos */
.uvid{background:#000}
.vsound{position:absolute;right:12px;bottom:14px;z-index:4;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;cursor:pointer}
.vsound svg{width:18px;height:18px}
.vsound.on{background:#B8893B}
.vmiss{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:#fff;background:#1a1a1a;font-size:13px;line-height:1.5}

.shot{display:block;width:100%;height:auto}
.shot-fill{display:block;width:100%;height:100%;object-fit:cover}
.phone .card-wrap .shot{box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}
.phone.auto .scroll > .shot{animation:autoscroll 38s ease-in-out infinite alternate}
.demo-shot{width:min(480px,100%);margin:0 auto;box-shadow:0 40px 80px -30px rgba(0,0,0,.45);border-radius:14px;overflow:hidden;background:#fff}
/* thumbs */
.tin.site{display:flex;align-items:stretch}
.tin .inv{width:100%}
.tin .inv .cover{min-height:100%;height:100%;padding:3em 1.6em}
.tin.cardt{display:grid;place-items:center;padding:9%;background:linear-gradient(160deg,#EDE4D6,#D8C8AF)}
.tin.cardt .card-inv{width:100%;box-shadow:0 20px 34px -18px rgba(0,0,0,.45)}

/* ===== admin ===== */
.adm{display:grid;grid-template-columns:250px 1fr;min-height:100vh;background:var(--bg)}
.adm-side{background:#2B0B14;color:#EAD9C2;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto}
.adm-side .logo{color:#F3DFB8;padding:4px 10px 22px;font-size:24px}
.adm-side a,.adm-side button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;text-decoration:none;color:#D8C4AA;font-size:14.5px;background:none;border:0;cursor:pointer;text-align:left;width:100%}
.adm-side a svg,.adm-side button svg{width:18px;height:18px;flex:none;opacity:.85}
.adm-side a:hover,.adm-side button:hover{background:rgba(255,255,255,.06);color:#fff}
.adm-side a.on{background:#F3DFB8;color:#2B0B14}
.adm-side .sub{padding-left:40px;font-size:13.5px}
.adm-side .grow{flex:1}
.adm-side .sep{height:1px;background:rgba(255,255,255,.08);margin:10px 4px}
.adm-main{min-width:0}
.adm-top{display:flex;align-items:center;gap:14px;padding:16px 30px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:20}
.adm-top h1{font-size:28px;font-weight:600;flex:1}
.adm-top .who{font-size:14px;color:var(--muted)}
.adm-body{padding:28px 30px 60px}
.adm-burger{display:none}
@media (max-width:900px){
  .adm{grid-template-columns:1fr}
  .adm-side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:80;transform:translateX(-100%);transition:transform .3s}
  .adm-side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
  .adm-burger{display:grid}
  .adm-top{padding:12px 16px}.adm-body{padding:20px 16px 60px}
}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:28px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px;text-decoration:none;color:inherit;transition:border-color .2s}
.stat:hover{border-color:var(--gold-soft)}
.stat span{font-size:13.5px;color:var(--muted)}
.stat b{display:block;font-family:var(--serif);font-size:40px;font-weight:600;line-height:1.1;margin-top:4px}
.stat.hl{background:var(--maroon);color:var(--on-maroon);border-color:var(--maroon)}
.stat.hl span{color:var(--on-maroon);opacity:.8}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:24px}
.panel-h{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-size:22px;flex:1}
.panel-b{padding:20px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:color-mix(in srgb,var(--sand) 50%,var(--surface))}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .th-img{width:46px;height:56px;border-radius:8px;overflow:hidden;position:relative;background:var(--sand)}
.tbl .th-img > *{position:absolute;inset:0}
.tbl .nm{font-weight:500}
.tbl .sub{font-size:13px;color:var(--muted)}
.acts-row{display:flex;gap:4px;justify-content:flex-end}
.ib{width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted);text-decoration:none}
.ib:hover{background:var(--sand);color:var(--maroon)}
.ib svg{width:17px;height:17px}
.ib.on{color:var(--gold)}
.st{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap}
.st-new{background:#E4EEFB;color:#1D4E8F}.st-contacted{background:#EFE7FB;color:#5B3A99}.st-payment-pending{background:#FDF0D8;color:#8A5A0B}.st-paid{background:#DDF3E6;color:#16693C}.st-in-progress{background:#FBE6DA;color:#96421A}.st-completed{background:#E3F0EC;color:#1E5B4B}.st-cancelled{background:#F3E1E1;color:#8E2727}
.st-pub{background:#DDF3E6;color:#16693C}.st-draft{background:var(--sand);color:var(--muted)}
.sw{position:relative;width:40px;height:23px;flex:none;display:inline-block}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:99px;background:#CDBFAE;cursor:pointer;transition:background .2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked + span{background:#1F8F55}
.sw input:checked + span::after{transform:translateX(17px)}
.sw input:focus-visible + span{outline:2px solid var(--gold);outline-offset:2px}
.form{display:grid;gap:18px}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media (max-width:700px){.form .row2,.form .row3{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:6px}
.fld > label,.fld > .lbl{font-size:13.5px;font-weight:500}
.fld .help{font-size:12.5px;color:var(--muted)}
.inp{width:100%;padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg);font-size:15px}
.inp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 20%,transparent)}
textarea.inp{min-height:96px;resize:vertical;line-height:1.5}
textarea.inp.tall{min-height:260px}
.checkrow{display:flex;gap:10px 22px;flex-wrap:wrap}
.checkrow label{display:flex;gap:8px;align-items:center;font-size:14.5px;cursor:pointer}
.fsec{border-top:1px solid var(--line);padding-top:18px;margin-top:6px}
.fsec h3{font-size:22px;margin-bottom:4px}
.fsec > p{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.upl{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.upl .pv{width:84px;height:100px;border-radius:10px;overflow:hidden;background:var(--sand);position:relative;border:1px solid var(--line)}
.upl .pv img{width:100%;height:100%;object-fit:cover}
.upl .pv.logo{width:64px;height:64px}
.upl .pv.logo img{object-fit:contain}
.form-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:14px 20px;display:flex;justify-content:flex-end;gap:10px;margin:0 -20px -20px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:0 14px;background:var(--bg)}
.search svg{width:16px;height:16px;color:var(--muted)}
.search input{border:0;background:none;padding:9px 0;outline:none;min-width:180px;font-size:14.5px}
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login .art{position:relative;background:radial-gradient(80% 100% at 50% 30%,#8C2336,#3B0A15);color:#F1D9A8;display:grid;place-items:center;overflow:hidden}
.login .art svg{width:60%;max-width:340px;opacity:.9}
.login .box{display:grid;place-items:center;padding:30px}
.login form{width:min(380px,100%);display:grid;gap:16px}
.login h1{font-size:44px;font-weight:500}
.login .err{color:#A12A2A;font-size:14px;min-height:20px}
.login .demo{font-size:13px;color:var(--muted);background:var(--sand);padding:10px 14px;border-radius:10px}
@media (max-width:800px){.login{grid-template-columns:1fr}.login .art{display:none}}
.order-list{display:flex;flex-direction:column;gap:8px}
.faq-row{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.faq-row:last-child{border-bottom:0}
.faq-row .q{flex:1;min-width:0}
.faq-row .q b{font-weight:500;display:block}
.faq-row .q span{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.ordn{font-family:var(--serif);font-size:20px;color:var(--gold);width:26px;text-align:center}
</style>

async function uploadMedia(file, folder, ext){
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
  const {error} = await sb.storage.from('media').upload(path, file, {contentType:file.type || undefined, cacheControl:'31536000', upsert:false});
  if(error) throw error;
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}
async function uploadDataUrl(dataUrl, folder){ const blob = await (await fetch(dataUrl)).blob(); const ext = (blob.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg').replace('svg+xml', 'svg'); return uploadMedia(blob, folder, ext); }
function removeMedia(url){ const m = String(url || '').split('/storage/v1/object/public/media/')[1]; if(m && sb) sb.storage.from('media').remove([decodeURIComponent(m)]).catch(() => {}); }

async function syncNow(){
  if(!ADMIN){ toast('Log in as admin to save changes.'); return false; }
  try {
    for(const k of Object.keys(MAPS)){
      const cur = new Map(DB[k].map(x => [x.id, x])); const up = [];
      for(const [id, x] of cur){ if(SNAP[k].get(id) !== JSON.stringify(x)){ if(PREP[k]) await PREP[k](x); up.push(x); } }
      const del = [...SNAP[k].keys()].filter(id => !cur.has(id));
      if(up.length){ const {error} = await sb.from(MAPS[k].table).upsert(up.map(x => toRow(k, x))); if(error) throw error; up.forEach(x => SNAP[k].set(x.id, JSON.stringify(x))); }
      if(del.length){ const {error} = await sb.from(MAPS[k].table).delete().in('id', del); if(error) throw error; del.forEach(id => SNAP[k].delete(id)); }
    }
    if(SNAP.settings !== JSON.stringify(DB.settings)){
      if(/^data:/.test(DB.settings.logo || '')) DB.settings.logo = await uploadDataUrl(DB.settings.logo, 'logo');
      const {error} = await sb.from('settings').upsert({id:1, data:DB.settings}); if(error) throw error;
      SNAP.settings = JSON.stringify(DB.settings);
    }
    return true;
  } catch(e){ console.error(e); toast('Could not save: ' + (e.message || 'network error') + '. Your change was not stored.'); return false; }
}

/* live behaviours inside invitations */
function mountLive(root){
  root = root || document;
  // countdowns
  const cds = $$('[data-cd]', root);
  if(cds.length){ const upd = () => { cds.forEach(el => { const tgt = new Date(el.dataset.cd + 'T18:00:00').getTime(); let s = Math.max(0, Math.floor((tgt - Date.now()) / 1000)); const v = [Math.floor(s/86400), Math.floor(s%86400/3600), Math.floor(s%3600/60), s%60]; $$('b', el).forEach((b, i) => b.textContent = String(v[i]).padStart(i ? 2 : 1, '0')); }); }; upd(); const iv = setInterval(upd, 1000); TIMERS.push(() => clearInterval(iv)); }
  // video players
  $$('.vid:not(.static)', root).forEach(v => {
    if(v.dataset.m) return; v.dataset.m = '1';
    const sc = $$('.scene', v), bar = $('.bar i', v), btn = $('.ctrl', v), D = 3400; let el = 0, playing = true, last = performance.now();
    const iv = setInterval(() => { if(!v.isConnected){ clearInterval(iv); return; } const now = performance.now(); if(playing) el += now - last; last = now; const tot = D * sc.length, x = el % tot, n = Math.floor(x / D); sc.forEach((s, j) => s.classList.toggle('on', j === n)); if(bar) bar.style.width = (x / tot * 100) + '%'; }, 120);
    TIMERS.push(() => clearInterval(iv));
    if(btn) btn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); playing = !playing; btn.innerHTML = ico(playing ? 'pause' : 'play'); btn.setAttribute('aria-label', playing ? 'Pause' : 'Play'); });
  });
  // uploaded videos
  $$('video.uvid', root).forEach(async v => {
    if(v.dataset.vkey){
      try {
        const blob = await VIDB.get(v.dataset.vkey);
        if(!blob){ v.insertAdjacentHTML('afterend', '<div class="vmiss">Video not found in this browser. Upload it again from the admin page.</div>'); return; }
        const u = URL.createObjectURL(blob); v.src = u; TIMERS.push(() => URL.revokeObjectURL(u)); v.play().catch(() => {});
      } catch(e){ return; }
    }
    const b = v.nextElementSibling;
    if(b && b.classList.contains('vsound')) b.addEventListener('click', () => { v.muted = !v.muted; if(!v.muted) v.play().catch(() => {}); b.classList.toggle('on', !v.muted); b.setAttribute('aria-label', v.muted ? 'Turn sound on' : 'Turn sound off'); });
  });
  // auto scrolling phone height
  $$('.phone.auto', root).forEach(p => { const scr = $('.scr', p); p.style.setProperty('--sh', scr.clientHeight + 'px'); });
  // rsvp
  $$('[data-rsvp]', root).forEach(f => f.addEventListener('submit', e => { e.preventDefault(); const n = f.n.value.trim() || 'Guest'; const a = f.a.value; const box = document.createElement('div'); box.className = 'ok'; box.innerHTML = `<b>Thank you, ${esc(n)}.</b><br>Your RSVP (${esc(a.toLowerCase())}, ${esc(f.g.value)} guest${f.g.value === '1' ? '' : 's'}) has been noted. This is a demo, so nothing was sent.`; f.replaceWith(box); }));
  // music
  $$('[data-music]', root).forEach(b => b.addEventListener('click', () => toggleMusic(b)));
}
let AUDIO = null;
function toggleMusic(btn){
  try {
    if(AUDIO){ const a = AUDIO; AUDIO = null; a.g.gain.setTargetAtTime(0, a.ctx.currentTime, .3); setTimeout(() => a.ctx.close(), 900); btn.classList.remove('on'); return; }
    const ctx = new (window.AudioContext || window.webkitAudioContext)(); const g = ctx.createGain(); g.gain.value = 0; g.connect(ctx.destination);
    [146.83, 220, 293.66, 110].forEach((f, i) => { const o = ctx.createOscillator(); o.type = i === 3 ? 'triangle' : 'sine'; o.frequency.value = f; const og = ctx.createGain(); og.gain.value = [.5, .35, .18, .3][i]; const lfo = ctx.createOscillator(); lfo.frequency.value = .1 + i * .07; const lg = ctx.createGain(); lg.gain.value = .15; lfo.connect(lg).connect(og.gain); o.connect(og).connect(g); o.start(); lfo.start(); });
    g.gain.setTargetAtTime(.06, ctx.currentTime, 1.2); AUDIO = {ctx, g}; btn.classList.add('on');
    TIMERS.push(() => { if(AUDIO){ AUDIO.ctx.close(); AUDIO = null; } });
  } catch(e){ toast('Audio is not available in this browser.'); }
}

function modal(html, onMount){
  const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(bg);
  const close = () => { bg.remove(); document.removeEventListener('keydown', esck); };
  const esck = e => { if(e.key === 'Escape') close(); };
  document.addEventListener('keydown', esck);
  bg.addEventListener('mousedown', e => { if(e.target === bg) close(); });
  $$('[data-close]', bg).forEach(b => b.onclick = close);
  const f = $('input,select,textarea', bg); if(f) f.focus();
  if(onMount) onMount(bg, close);
  return close;
}

function readImage(file, max){
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onerror = rej; fr.onload = () => { if(file.type === 'image/svg+xml'){ res(fr.result); return; } const img = new Image(); img.onerror = rej; img.onload = () => { const sc = Math.min(1, (max || 1000) / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', .82)); }; img.src = fr.result; }; fr.readAsDataURL(file); });
}

    <div class="fld"><label for="f-about">About this template</label><textarea class="inp" id="f-about">${esc(t.about)}</textarea></div>

    <div class="fsec"><h3>Design and preview</h3><p>The live preview is generated from the theme, motif and demo content. If you upload an image, it replaces the generated design everywhere: listing thumbnail, phone preview and demo page. For website templates, a tall full-page screenshot works best, and it scrolls inside the phone.</p>
      <div class="row2"><div class="fld"><label for="f-theme">Colour theme</label><select class="inp" id="f-theme">${opt(THEMES, t.theme)}</select></div><div class="fld"><label for="f-motif">Motif</label><select class="inp" id="f-motif">${opt(MOTIFS, t.motif)}</select></div></div>

      <div class="fld" style="margin-top:14px"><label for="f-demourl">External demo URL (optional)</label><input class="inp" id="f-demourl" value="${esc(t.demoUrl)}" placeholder="https://"><span class="help">Leave empty to use the built-in interactive demo.</span></div></div>

      <div class="row3" style="margin-top:14px"><div class="fld"><label for="d-greet">Greeting</label><input class="inp" id="d-greet" value="${esc(d.greeting)}"></div><div class="fld"><label for="d-city">City</label><input class="inp" id="d-city" value="${esc(d.city)}"></div><div class="fld"><label for="d-venue">Venue</label><input class="inp" id="d-venue" value="${esc(d.venue)}"></div></div>
      <div class="row2" style="margin-top:14px"><div class="fld"><label for="d-bp">Bride's parents</label><input class="inp" id="d-bp" value="${esc(d.brideParents)}"></div><div class="fld"><label for="d-gp">Groom's parents</label><input class="inp" id="d-gp" value="${esc(d.groomParents)}"></div></div>
      <div class="row2" style="margin-top:14px"><div class="fld"><label for="d-welcome">Welcome message</label><textarea class="inp" id="d-welcome">${esc(d.welcome)}</textarea></div><div class="fld"><label for="d-story">Story</label><textarea class="inp" id="d-story">${esc(d.story)}</textarea></div></div>

      <div class="fld" style="margin-top:14px"><label for="d-tag">Hashtag</label><input class="inp" id="d-tag" value="${esc(d.hashtag)}"></div></div>

    <div class="fsec"><h3>Template page content</h3><p>One item per line.</p>

      <div class="fld" style="margin-top:14px"><label for="f-who">Who is this for</label><textarea class="inp" id="f-who">${esc(t.who.join('\n'))}</textarea></div>

    <div class="fsec"><h3>SEO</h3><p>Leave empty to use the template name and description.</p>
      <div class="row2"><div class="fld"><label for="f-seot">SEO title</label><input class="inp" id="f-seot" value="${esc(t.seoTitle)}"></div><div class="fld"><label for="f-seod">SEO description</label><input class="inp" id="f-seod" value="${esc(t.seoDescription)}"></div></div></div>
    <div class="form-foot"><a class="btn btn-ghost btn-sm" href="#/admin/templates">Cancel</a><button class="btn btn-primary btn-sm" type="submit">${editing ? 'Save changes' : 'Create template'}</button></div>
  </div></form>`;
  return {html:adminLayout('tpl-' + t.type, editing ? 'Edit template' : 'Add template', body, editing ? `<a class="btn btn-ghost btn-sm" href="#/template/${esc(t.slug)}" target="_blank" rel="noopener">${ico('eye')} View on site</a>` : ''), after:() => {
    adminBind();
    let slugTouched = editing;
    $('#f-name').oninput = e => { if(!slugTouched){ $('#f-slug').value = slugify(e.target.value); $('#slugPv').textContent = $('#f-slug').value || 'your-slug'; } };
    $('#f-slug').oninput = e => { slugTouched = true; $('#slugPv').textContent = slugify(e.target.value) || 'your-slug'; };
    const refreshPv = () => { if(t.previewImage) return; t.theme = $('#f-theme').value; t.motif = $('#f-motif').value; t.type = $('#f-type').value; $('#pvBox').innerHTML = thumb(t); };
    ['#f-theme','#f-motif','#f-type'].forEach(s => $(s).onchange = refreshPv);
    $('#f-type').addEventListener('change', e => { $('#vidFld').hidden = e.target.value !== 'video'; });
    let newVid = null, removeVid = false;
    $('#f-vid').onchange = e => { const f = e.target.files[0]; if(!f) return;
      if(!f.type.startsWith('video/')){ toast('Choose a video file, such as MP4.'); e.target.value = ''; return; }
      if(f.size > 50 * 1024 * 1024){ toast('That video is over 50 MB. Compress it (HandBrake is free) and try again.'); e.target.value = ''; return; }
      newVid = f; removeVid = false; const u = URL.createObjectURL(f); TIMERS.push(() => URL.revokeObjectURL(u));
      $('#vpv').innerHTML = `<video class="shot-fill" src="${u}" muted autoplay loop playsinline></video>`; $('#rmVid').hidden = false; };
    $('#rmVid').onclick = () => { newVid = null; removeVid = true; $('#f-vid').value = ''; $('#f-vurl').value = ''; $('#vpv').innerHTML = ''; $('#rmVid').hidden = true; };
    $('#f-img').onchange = async e => { const f = e.target.files[0]; if(!f) return; try { t.previewImage = await readImage(f, 900); $('#pvBox').innerHTML = `<img src="${t.previewImage}" alt="">`; $('#rmImg').hidden = false; } catch(err){ toast('That file could not be read. Try a JPG or PNG.'); } };
    $('#rmImg').onclick = () => { t.previewImage = ''; $('#f-img').value = ''; $('#rmImg').hidden = true; refreshPv(); };
    $('#tf').onsubmit = async e => {
      e.preventDefault();
      const name = $('#f-name').value.trim(); if(!name){ toast('Add a template name.'); $('#f-name').focus(); return; }
      const slug = slugify($('#f-slug').value || name);
      if(DB.templates.some(x => x.slug === slug && x.id !== t.id)){ toast('Another template already uses that slug. Choose a different one.'); $('#f-slug').focus(); return; }
      const events = lines($('#d-events').value).map(l => { const [n, dt, tm, vn] = l.split('|').map(x => (x || '').trim()); return {name:n || 'Event', date:/^\d{4}-\d{2}-\d{2}$/.test(dt) ? dt : ($('#d-date').value || d.date), time:tm || '', venue:vn || $('#d-venue').value}; });
      Object.assign(t, {
        name, slug, type:$('#f-type').value, price:Number($('#f-price').value) || 0, order:Number($('#f-order').value) || 0,
        categories:$$('input[name=cat]:checked').map(x => x.value), description:$('#f-desc').value.trim(), about:$('#f-about').value.trim(),
        published:$('#f-pub').checked, featured:$('#f-feat').checked, theme:$('#f-theme').value, motif:$('#f-motif').value, demoUrl:$('#f-demourl').value.trim(),
        included:lines($('#f-inc').value), why:lines($('#f-why').value), who:lines($('#f-who').value),
        faq:lines($('#f-faq').value).map(l => { const [q2, ...a] = l.split('::'); return {q:q2.trim(), a:a.join('::').trim()}; }).filter(f => f.q),
        seoTitle:$('#f-seot').value.trim(), seoDescription:$('#f-seod').value.trim()
      });
      Object.assign(t.demo, {bride:$('#d-b').value.trim() || 'Ananya', groom:$('#d-g').value.trim() || 'Arjun', date:$('#d-date').value || d.date, greeting:$('#d-greet').value.trim(), city:$('#d-city').value.trim(), venue:$('#d-venue').value.trim(), address:$('#d-venue').value.trim() + ', ' + $('#d-city').value.trim(), brideParents:$('#d-bp').value.trim(), groomParents:$('#d-gp').value.trim(), welcome:$('#d-welcome').value.trim(), story:$('#d-story').value.trim(), events:events.length ? events : d.events, hashtag:$('#d-tag').value.trim()});
      if(!editing){ t.id = slug; if(DB.templates.some(x => x.id === t.id)) t.id = uid(slug); }
      const oldVideo = src ? src.videoUrl : '';
      t.videoUrl = $('#f-vurl').value.trim(); t.videoKey = '';
      const sbtn = $('#tf button[type=submit]'), sLabel = sbtn.textContent;
      if(newVid){
        sbtn.disabled = true; sbtn.textContent = 'Uploading video...';
        try { const ext = (newVid.name.split('.').pop() || 'mp4').toLowerCase(); t.videoUrl = await uploadMedia(newVid, 'videos', ext); }
        catch(err){ sbtn.disabled = false; sbtn.textContent = sLabel; toast('Video upload failed: ' + (err.message || 'network error') + '. Videos must be under 50 MB.'); return; }
      }
      if(oldVideo && oldVideo !== t.videoUrl) removeMedia(oldVideo);
      sbtn.disabled = true; sbtn.textContent = 'Saving...';
      if(editing){ const i = DB.templates.findIndex(x => x.id === t.id); DB.templates[i] = t; }
      else DB.templates.push(t);
      if(await save()){ toast(editing ? 'Changes saved.' : 'Template created.'); location.hash = '#/admin/templates?type=' + t.type; } else { sbtn.disabled = false; sbtn.textContent = sLabel; }
    };
  }};
}

function orderModal(o, done){
  const editing = !!o; o = o || {id:uid('o'), name:'', phone:'', templateId:'', templateName:'', type:'website', price:0, status:'New', date:new Date().toISOString().slice(0, 10), notes:''};
  const tplOpts = Object.entries(TYPES).map(([k, v]) => `<optgroup label="${v.plural}">${DB.templates.filter(t => t.type === k).map(t => `<option value="${esc(t.id)}" ${t.id === o.templateId ? 'selected' : ''}>${esc(t.name)} (${inr(t.price)})</option>`).join('')}</optgroup>`).join('');
  modal(`<h3>${editing ? 'Edit enquiry' : 'Log an enquiry'}</h3><form class="form" id="of">
    <div class="row2"><div class="fld"><label for="o-n">Customer name</label><input class="inp" id="o-n" required value="${esc(o.name)}"></div><div class="fld"><label for="o-p">Phone number</label><input class="inp" id="o-p" value="${esc(o.phone)}" placeholder="+91"></div></div>
    <div class="fld"><label for="o-t">Template</label><select class="inp" id="o-t"><option value="">Select a template</option>${tplOpts}</select></div>
    <div class="row3"><div class="fld"><label for="o-ty">Type</label><select class="inp" id="o-ty">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${k === o.type ? 'selected' : ''}>${v.short}</option>`).join('')}</select></div><div class="fld"><label for="o-pr">Price (₹)</label><input class="inp" id="o-pr" type="number" value="${o.price}"></div><div class="fld"><label for="o-d">Date</label><input class="inp" id="o-d" type="date" value="${esc(o.date)}"></div></div>
    <div class="fld"><label for="o-s">Status</label><select class="inp" id="o-s">${STATUSES.map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
    <div class="fld"><label for="o-no">Notes</label><textarea class="inp" id="o-no">${esc(o.notes)}</textarea></div>
    <div class="acts"><button type="button" class="btn btn-ghost btn-sm" data-close>Cancel</button><button class="btn btn-primary btn-sm" type="submit">${editing ? 'Save enquiry' : 'Add enquiry'}</button></div></form>`,
  (bg, close) => {
    $('#o-t', bg).onchange = e => { const t = DB.templates.find(x => x.id === e.target.value); if(t){ $('#o-ty', bg).value = t.type; $('#o-pr', bg).value = t.price; } };
    $('#of', bg).onsubmit = async e => { e.preventDefault(); const name = $('#o-n', bg).value.trim(); if(!name){ toast('Add the customer name.'); return; }
      const t = DB.templates.find(x => x.id === $('#o-t', bg).value);
      Object.assign(o, {name, phone:$('#o-p', bg).value.trim(), templateId:t ? t.id : '', templateName:t ? t.name : 'Not decided', type:$('#o-ty', bg).value, price:Number($('#o-pr', bg).value) || 0, date:$('#o-d', bg).value, status:$('#o-s', bg).value, notes:$('#o-no', bg).value.trim()});
      if(!editing) DB.orders.unshift(o); else { const i = DB.orders.findIndex(x => x.id === o.id); DB.orders[i] = o; }
      if(await save()){ close(); toast(editing ? 'Enquiry saved.' : 'Enquiry added.'); done && done(); } };
  });
}
function adminOrders(q){
  const state = {s:'', st:q.get('status') || '', ty:''};
  const body = `<div class="panel"><div class="panel-h">
    <div class="search">${ico('search')}<input id="os" placeholder="Search name, phone or template" aria-label="Search enquiries"></div>
    <select class="sel" id="ost" aria-label="Filter by status"><option value="">All statuses</option>${STATUSES.map(s => `<option ${s === state.st ? 'selected' : ''}>${s}</option>`).join('')}</select>
    <select class="sel" id="oty" aria-label="Filter by type"><option value="">All types</option>${Object.entries(TYPES).map(([k, v]) => `<option value="${k}">${v.short}</option>`).join('')}</select>
    <div style="flex:1"></div><span class="muted" id="ocount" style="font-size:14px"></span></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Customer</th><th>Template</th><th>Price</th><th>Status</th><th>Date</th><th>Notes</th><th></th></tr></thead><tbody id="ob"></tbody></table></div></div>
    <p class="muted" style="font-size:13.5px">Orders arrive on WhatsApp. Log each one here to track payment and delivery.</p>`;
  const draw = () => {
    const L = DB.orders.filter(o => (!state.st || o.status === state.st) && (!state.ty || o.type === state.ty) && (!state.s || (o.name + ' ' + o.phone + ' ' + o.templateName).toLowerCase().includes(state.s))).sort((a, b) => b.date.localeCompare(a.date));
    $('#ocount').textContent = `${L.length} of ${DB.orders.length} enquiries`;
    $('#ob').innerHTML = L.map(o => `<tr data-id="${esc(o.id)}"><td><div class="nm">${esc(o.name)}</div><div class="sub">${o.phone ? `<a href="https://wa.me/${esc(o.phone.replace(/\D/g, ''))}" target="_blank" rel="noopener">${esc(o.phone)}</a>` : ''}</div></td>
      <td>${esc(o.templateName)}<div class="sub">${esc(TYPES[o.type] ? TYPES[o.type].label : '')}</div></td><td>${inr(o.price)}</td>
      <td><select class="sel" style="padding:5px 8px;font-size:13px" data-st aria-label="Status">${STATUSES.map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
      <td>${esc(fmtDate(o.date, {day:'numeric', month:'short', year:'numeric'}))}</td><td class="sub" style="max-width:220px">${esc(o.notes)}</td>
      <td><div class="acts-row"><button class="ib" data-edit aria-label="Edit">${ico('edit')}</button><button class="ib" data-del aria-label="Delete">${ico('trash')}</button></div></td></tr>`).join('') || `<tr><td colspan="7"><div class="empty" style="border:0">No enquiries match these filters.</div></td></tr>`;
  };
  return {html:adminLayout('orders', 'Orders / Enquiries', body, `<button class="btn btn-primary btn-sm" id="addO">${ico('plus')} Log an enquiry</button>`), after:() => {
    adminBind(); draw();
    $('#addO').onclick = () => orderModal(null, draw);
    $('#os').oninput = e => { state.s = e.target.value.toLowerCase().trim(); draw(); };
    $('#ost').onchange = e => { state.st = e.target.value; draw(); };
    $('#oty').onchange = e => { state.ty = e.target.value; draw(); };
    $('#ob').addEventListener('change', e => { if(!e.target.matches('[data-st]')) return; const o = DB.orders.find(x => x.id === e.target.closest('tr').dataset.id); o.status = e.target.value; save(); toast('Status updated to ' + o.status + '.'); });
    $('#ob').addEventListener('click', e => { const tr = e.target.closest('tr'); if(!tr) return; const o = DB.orders.find(x => x.id === tr.dataset.id);
      if(e.target.closest('[data-edit]')) orderModal(o, draw);
      if(e.target.closest('[data-del]')) confirmBox(`Delete the enquiry from ${o.name}?`, () => { DB.orders = DB.orders.filter(x => x !== o); save(); draw(); toast('Enquiry deleted.'); }); });
  }};
}
